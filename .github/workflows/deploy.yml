name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A burst of pushes (3 commits in 30s) used to start parallel runs whose
# wrangler uploads could finish out of order. cancel-in-progress means
# the latest push always wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Full history, blobs on demand: src/lib/routeLastModified.ts dates each
      # sitemap URL by the last commit to its route folder. The default depth-1
      # clone would give every route the same date, so the helper emits none.
      # blob:none keeps this cheap — path-limited `git log` reads only commits
      # and trees.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # The unit suite GATES the deploy instead of racing it. unit-tests.yml
      # still runs the same suite on PRs and path-filtered pushes; this step is
      # what makes a red test actually stop a release -- the difference between
      # a guard and a notification. Before this, a bad league label (or a drift
      # between the two copies of SPOILER_RX) shipped and the test told you
      # afterwards.
      #
      # It is free: npm ci already ran above, and the suite is ~1s with no
      # browser and no network.
      #
      # Keep it that way. Only fast, hermetic tests belong in test:unit -- a
      # network- or browser-dependent test in here would start failing for
      # reasons that are not the commit's fault, and a gate that cries wolf is
      # a gate someone eventually removes. Slow checks (lighthouse.yml, the
      # visual tests) stay in their own alerting workflows on purpose.
      - run: npm run test:unit

      # NEXT_PUBLIC_BUILD_SHA is inlined into the client bundle and rides along
      # on every feedback submission, so a bug report says which build it came
      # from without a round-trip. A local build leaves it unset → "dev".
      - run: npm run build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=nospoilerscores --branch=main

      # CF Pages's upload step has shipped "successful" deploys today that
      # actually 500'd at prod (missing chunks/assets). Fail the workflow if
      # hidescore.com isn't 200 within a few seconds of the deploy returning.
      - name: Smoke-test prod
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://hidescore.com/)
          if [ "$code" != "200" ]; then
            echo "::error::hidescore.com returned HTTP $code after deploy"
            exit 1
          fi
          echo "hidescore.com responded 200"
