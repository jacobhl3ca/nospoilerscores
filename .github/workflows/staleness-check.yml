name: Check feed staleness

on:
  schedule:
    # Hourly — catches Mac mini death, token revocation, R2 outage, silent
    # scrape regressions. Trimmed from */30 to stay under the Actions free cap.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the alert step reads the previous run's conclusion (grace check)
    steps:
      # Treat pre-script GitHub infra failures (checkout 403s, setup-node hiccups)
      # as skips, not job failures — only the staleness script's exit code should
      # email. A sustained Actions outage will surface via the publishing workflows.
      - uses: actions/checkout@v7
        id: checkout
        continue-on-error: true
      - uses: actions/setup-node@v6
        id: setup
        if: steps.checkout.outcome == 'success'
        with:
          node-version: 22
        continue-on-error: true
      - id: check
        if: steps.checkout.outcome == 'success' && steps.setup.outcome == 'success'
        run: node scripts/check-staleness.mjs
      # NOTE: the highlight-fallback check moved OFF GitHub Actions on 2026-06-30.
      # hidescore.com is behind Cloudflare, which bot-challenges GHA runner IPs,
      # so every /api/youtube lookup timed out and ALL games falsely reported
      # "EXHAUSTED" (62-min runs, daily false email on issue #7). It now runs on
      # the Mac mini's residential IP via launchd com.jacob.highlight-fallback-monitor
      # (wrapper ~/bin/highlight-fallback-cron.sh) → ntfy on real misses.
      # check-highlight-fallbacks.mjs stays in the repo; the mini runs it from main.
      # Real-failure alert — ntfy ONLY, never a GitHub issue.
      #
      # Rewritten 2026-07-20. The old version opened/commented on a GitHub issue,
      # which @-mentioned Jacob and emailed him on EVERY hourly failure plus a
      # "Recovered" close comment. The feeds flap (fail at :20, heal by :29), so
      # a self-healing blip cost 4 emails. House rule for all monitors:
      # DOWN-only + 1h grace, no green "recovered" pings.
      #
      # Grace: this run only alerts if the PREVIOUS run of this workflow also
      # failed, i.e. the feeds have been stale for 2 consecutive hourly checks.
      # A single-run blip that self-heals stays completely silent.
      - name: Alert on sustained failure (ntfy, 1h grace)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          prev="$(gh run list --workflow staleness-check.yml --status completed \
                    --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          if [ "$prev" != "failure" ]; then
            echo "First failure (previous run: ${prev:-none}) — inside 1h grace, staying silent."
            exit 0
          fi
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC secret unset — cannot alert."
            exit 0
          fi
          curl -s -H "Title: HideScore feeds stale 2h+" -H "Priority: high" -H "Tags: rotating_light" \
            -d "Staleness check has failed twice in a row. $run_url" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
      # No recovery notification by design — silence IS the recovery signal.
