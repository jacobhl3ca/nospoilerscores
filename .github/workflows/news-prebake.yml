name: Prebake news feeds

# moved to the mini 2026-09-14 (launchd com.hidescore.reddit-prebake, every 30 min,
# runs the FULL prebake-news.mjs + R2 upload); manual fallback only.
# History: 2026-07-07 this dropped to a once-a-day safety net; 2026-09-14 the
# free Actions quota ran out, so the schedule went too. Run it by hand from the
# Actions tab when the mini is down.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Skip espn-* AND reddit-*: both need a residential IP. ESPN's CloudFront
      # WAF challenges GHA datacenter IPs (HTTP 202 + empty body,
      # `x-amzn-waf-action: challenge`), and Reddit 403s datacenter IPs on every
      # unauthenticated endpoint (so GHA's reddit runs only burned retries and,
      # on a lucky single success, raced the mini's authoritative copy). The
      # residential-IP Mac mini cron (com.hidescore.reddit-prebake, hourly) owns
      # all of these feeds and uploads them to the same R2 bucket.
      # (quoted so the shell never globs reddit-* against the working dir)
      - run: node scripts/prebake-news.mjs '--skip=espn-top,espn-videos,reddit-*'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Upload news feeds to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@^4
          for f in public/news/*.json; do
            for attempt in 1 2 3; do
              if wrangler r2 object put "hidescore-data/news/$(basename "$f")" --file "$f" --remote --content-type application/json; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::wrangler upload failed 3x for $f"
                exit 1
              fi
              echo "wrangler attempt $attempt failed, retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            done
          done
