name: Sticky header guard

# Holds TWO invariants, one spec each:
#
# 1. tests/visual/sticky-seam.spec.ts: the sticky league title is never pushed
#    off its natural position onto the game card below it ("the first game card
#    has no top outline", reported four times, "fixed" three times with padding
#    tweaks). The cause is a measurement race: content started at the header's
#    REAL height while sticky rows pinned at the MEASURED --header-h. The fix is
#    structural (fixed header + .header-flow-spacer sized by the same
#    --header-h), and it holds only while those two stay the same number.
#
# 2. tests/visual/sticky-seams.spec.ts: no pinned sticky row, in any view
#    (Scores, News Cards, News ESPN, desktop + phone, toolbar shown + hidden),
#    shows page content in a crack above it (sixth report, Jacob 10/9: Firefox
#    at 80% opened a 1-device-px row under the Reddit bar). The fix is the
#    default-on .sticky::before "seam lip" in globals.css; the spec probes every
#    sticky row it finds, so a new row is held without editing the spec.
#
# Deliberately NOT part of deploy.yml: a regression here is cosmetic, so this
# must never be able to block a deploy. It runs alongside and alerts.

# 2026-10-09: push to main is back (the repo is public, Actions minutes are
# free), so direct pushes that skip a PR are checked too.
on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/app/globals.css'
      - 'src/lib/useNewsToolbar.ts'
      - 'tests/visual/sticky-*.spec.ts'
      - 'playwright.config.ts'
  push:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/app/globals.css'
      - 'src/lib/useNewsToolbar.ts'
      - 'tests/visual/sticky-*.spec.ts'
      - 'playwright.config.ts'
  workflow_dispatch:

concurrency:
  group: sticky-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sticky-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Chromium only — playwright.config provisions no other browser, and the
      # repo can't install WebKit via playwright-core anyway.
      - run: npx playwright install --with-deps chromium

      # playwright.config's webServer starts `npm run dev` on :3000 itself.
      # --workers=1 because both specs drive the same sticky geometry and the
      # shared dev server compiles routes lazily; parallel races the first
      # compile.
      - name: Run the sticky invariant suites
        run: npx playwright test tests/visual/sticky-seam.spec.ts tests/visual/sticky-seams.spec.ts --workers=1 --reporter=line

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sticky-guard-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # No grace window here, unlike staleness-check.yml: that monitor watches
      # flapping external feeds, this one watches deterministic local geometry.
      # A failure means a sticky row came off its pin or a seam lost its lip,
      # which never self-heals — so it pages on the first failure. Playwright's own
      # CI retry (retries: 1 in playwright.config) absorbs genuine flakes first.
      - name: Alert on failure
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            # Loud, not a warning: an alerter that cannot alert must not exit 0.
            echo "::error::PUSHOVER_TOKEN / PUSHOVER_USER not set — this alert reached NOBODY."
            exit 1
          fi
          # Pushover since 2026-09-22 (ntfy is retired from the phone).
          # priority -2 = lands in the Pushover app with no popup, mirroring the
          # `HideScore|-2` rule in ~/private/pushover-allow, which a runner can't read.
          resp="$(curl -s --max-time 20 \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=HideScore sticky header regression" \
            --form-string "message=A sticky row shows page content in a crack, or the league title is pushed onto the first card. Run: $run_url" \
            --form-string "priority=-2" \
            --form-string "url=$run_url" \
            --form-string "url_title=Open the failing run" \
            https://api.pushover.net/1/messages.json)"
          case "$resp" in
            *'"status":1'*) echo "Pushover accepted the alert." ;;
            *) echo "::error::Pushover rejected the alert: $resp"; exit 1 ;;
          esac
