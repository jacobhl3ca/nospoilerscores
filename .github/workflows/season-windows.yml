name: Check season windows

# Every ALL_LEAGUES window in src/lib/espn.ts is a hand-written MM-DD pair, and
# a stale one fails SILENTLY — the league column just disappears, at the worst
# possible moment, because the end of a window is where the championship is.
# Two live examples were found by hand on 2026-08-09: the NFL window closed five
# days before Super Bowl LXI, and the NCAAF window closed before the playoff
# semifinals, hiding the National Championship. This is that check, automated.
#
# Twice monthly, not daily: these are annual schedules, and ESPN publishes a
# season's fixtures in one go.
#
# The 3rd was originally picked on the belief that "leagues announce schedules in
# the first days of a month". That is wrong, and the repo's own data says so —
# every scheduleReleaseDate in espn.ts is mid-month except WNBA's:
#
#   nba 08-14   mlb 07-16   nhl 07-16   nfl 05-14   epl 06-19   wnba 12-01
#
# So the NBA's 2026-27 schedule dropped on 08-14 and the next scheduled run was
# 09-03, three weeks later. The 17th covers the 14th/16th/19th cluster with a few
# days' slack for ESPN to ingest the fixtures; the 3rd stays as a floor and
# catches WNBA.
#
# Runs plain node against ESPN's public API. No credentials, no Claude, no
# Mac mini — it costs nothing but a free-tier Actions minute.

on:
  schedule:
    - cron: "0 15 3 * *"
    - cron: "0 15 17 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Same convention as staleness-check.yml: pre-script infra flakes are
      # skips, not failures — only the script's own exit code should alert.
      - uses: actions/checkout@v6
        id: checkout
        continue-on-error: true
      - uses: actions/setup-node@v6
        id: setup
        if: steps.checkout.outcome == 'success'
        with:
          node-version: 22
        continue-on-error: true
      - id: check
        if: steps.checkout.outcome == 'success' && steps.setup.outcome == 'success'
        run: node scripts/check-season-windows.mjs --all
      # DOWN-only, no grace period. Unlike the feed check this cannot flap: a
      # league window is either right or wrong, and it stays wrong until someone
      # edits espn.ts. No "recovered" ping by design — silence is the signal.
      - name: Alert on a bad or unverified window (Pushover)
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            # Loud, not a warning: an alerter that cannot alert must not exit 0.
            echo "::error::PUSHOVER_TOKEN / PUSHOVER_USER not set — this alert reached NOBODY."
            exit 1
          fi
          # Pushover since 2026-09-22 (ntfy is retired from the phone).
          # priority -2 = lands in the Pushover app with no popup, mirroring the
          # `HideScore|-2` rule in ~/private/pushover-allow, which a runner can't read.
          resp="$(curl -s --max-time 20 \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=HideScore league window needs a look" \
            --form-string "message=Either a season window in espn.ts no longer matches ESPN's fixtures (a league column will vanish early or open late), or a league published a new schedule that nobody has verified the window against yet." \
            --form-string "priority=-2" \
            --form-string "url=$run_url" \
            --form-string "url_title=Open the failing run" \
            https://api.pushover.net/1/messages.json)"
          case "$resp" in
            *'"status":1'*) echo "Pushover accepted the alert." ;;
            *) echo "::error::Pushover rejected the alert: $resp"; exit 1 ;;
          esac
