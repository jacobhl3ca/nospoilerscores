name: Prebake highlight share cards

# moved to the mini 2026-09-14 (launchd com.hidescore.share-cards, hourly,
# ~/bin/hidescore-share-cards-cron.sh); manual fallback only.
# Hourly cadence kept there: finished games get a matchup preview card within
# an hour, well before a highlight is even shareable (per-league buffer is
# 3–5h after start). Covers yesterday + today (ET) each run.
on:
  workflow_dispatch:

# A new run supersedes an in-flight one; we only care about the latest cards.
concurrency:
  group: share-cards
  cancel-in-progress: true

jobs:
  prebake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # node-canvas ships prebuilt linux-x64 binaries; no apt deps needed.
      - run: npm install canvas@^3
      - run: node scripts/prebake-share-cards.mjs
      - name: Upload share cards to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@^4
          shopt -s nullglob
          cards=(share-cards-out/*.png)
          echo "Uploading ${#cards[@]} cards to R2…"
          # R2 occasionally returns a transient 500 (code 10001 "internal error,
          # please try again") on a single object PUT. Without retries one blip
          # aborts the whole hourly job. Retry each card up to 3x with backoff;
          # only fail the job if a card is still failing after all attempts.
          failed=()
          for f in "${cards[@]}"; do
            key="cards/$(basename "$f")"
            ok=false
            for attempt in 1 2 3; do
              if wrangler r2 object put "hidescore-data/$key" --file "$f" --remote --content-type image/png; then
                ok=true
                break
              fi
              echo "Attempt $attempt failed for $key; retrying in $((attempt * 3))s…"
              sleep $((attempt * 3))
            done
            if [ "$ok" = false ]; then
              echo "::warning::Failed to upload $key after 3 attempts"
              failed+=("$key")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to upload ${#failed[@]} card(s) after retries: ${failed[*]}"
            exit 1
          fi
          echo "Done — uploaded ${#cards[@]} cards."
