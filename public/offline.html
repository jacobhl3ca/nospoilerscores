<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HideScore — offline</title>
<style>
  /* Follow the OS light/dark preference. This static fallback is served by the
     service worker with no access to the app's JS-driven [data-theme] choice,
     so prefers-color-scheme is the only signal available here — the same reason
     global-error.tsx keys its palette off it. Light is the default; the dark
     values below are byte-for-byte the page's originals, so a dark-mode device
     renders exactly as before and only light-mode devices gain a light screen
     (matching the app, whose default theme also follows the OS setting). */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --line: rgba(0, 0, 0, 0.1);
    --accent: #111111;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #f4f4f5;
      --muted: #9b9ba3;
      --line: #26262b;
      --accent: #f4f4f5;
      --accent-fg: #0a0a0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-user-select: none;
    user-select: none;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border-radius: 16px; border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .mark svg { width: 28px; height: 28px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
  button {
    -webkit-appearance: none; appearance: none;
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-fg);
    border: 0; border-radius: 12px;
    padding: 13px 28px; min-width: 160px;
    cursor: pointer;
  }
  button:active { opacity: 0.75; }
  .note { margin: 20px 0 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M2 8.8a16 16 0 0 1 20 0M5.5 12.6a11 11 0 0 1 13 0M9 16.4a6 6 0 0 1 6 0"/><circle cx="12" cy="20" r="0.9" fill="currentColor" stroke="none"/><path d="M3 3l18 18"/></svg>
  </div>
  <h1>No connection</h1>
  <p>HideScore loads today&rsquo;s games live, so it won&rsquo;t show you a cached scoreboard that might be hours stale. Reconnect and try again.</p>
  <button type="button" id="retry">Try again</button>
  <p class="note">hidescore.com</p>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    location.replace('https://hidescore.com/');
  });
</script>
</body>
</html>
